[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-momentum-ml"
version = "0.1.0"
description = "Educational research project: can lagged momentum features predict next-day direction out of sample?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "yfinance>=0.2.40",
    "xgboost>=2.0",
    "PyYAML>=6.0",
    "scipy>=1.10",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "black>=24.0",
    "jupyter>=1.0",
]
stats = ["statsmodels>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD"]
# PD010: pivot is clearer than pivot_table for unique (date, ticker) keys
# NPY002: np.random.seed is set deliberately for any third-party code using the global RNG
ignore = ["PD011", "PD010", "NPY002", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["momentum_ml"]
